# Nginx для The Quiet Place Project.
# Домен: gagroup24.ru, ресурсы: 194.226.122.180
# Установка:
#   sudo cp deploy/nginx-quietplace.conf /etc/nginx/sites-available/quietplace
#   sudo ln -s /etc/nginx/sites-available/quietplace /etc/nginx/sites-enabled/quietplace
#   sudo nginx -t && sudo systemctl reload nginx
# Сертификат: sudo certbot certonly --webroot -w /var/www/certbot -d gagroup24.ru -d www.gagroup24.ru

# Перенаправление HTTP на HTTPS. Путь /.well-known/ оставлен для обновления сертификата.
server {
    listen 80;
    listen [::]:80;
    server_name gagroup24.ru www.gagroup24.ru;
    access_log off;
    error_log /dev/null crit;
    add_header X-No-Data-Collection "true" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gagroup24.ru www.gagroup24.ru;

    # Пути, которые заполняет certbot для домена gagroup24.ru.
    ssl_certificate     /etc/letsencrypt/live/gagroup24.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gagroup24.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log off;
    # Даже error_log отключён, чтобы URI запросов не сохранялись на диск.
    error_log /dev/null crit;

    # Никакой аналитики, телеметрии и сторонних ресурсов.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-No-Data-Collection "true" always;
    add_header Permissions-Policy "interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

    # Аудио и статика отдаются только со своего домена, без внешних CDN.
    client_max_body_size 1m;
    server_tokens off;

    location / {
        # Приложение не принимает пользовательский текст по HTTP.
        limit_except GET HEAD { deny all; }

        # Приватные заголовки задаются одним слоем — этим reverse proxy.
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-No-Data-Collection;
        proxy_hide_header Permissions-Policy;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
