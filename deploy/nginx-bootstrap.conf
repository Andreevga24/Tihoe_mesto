# Временный HTTP-only сервер для выпуска Let's Encrypt до включения HTTPS-конфига.
# Домен: gagroup24.ru
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx-bootstrap.conf /etc/nginx/sites-available/quietplace
#   sudo ln -s /etc/nginx/sites-available/quietplace /etc/nginx/sites-enabled/quietplace
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d gagroup24.ru -d www.gagroup24.ru
# После выпуска замените файл на deploy/nginx-quietplace.conf.
#
# Никакого ssl_certificate здесь нет намеренно: Nginx с несуществующим сертификатом
# не запускается вообще, и nginx -t падает с BIO_new_file() failed.
# location / отдаёт 404, а не редирект на HTTPS: redirect отправил бы проверку
# Let's Encrypt на ещё не настроенный 443 и она получила бы connection refused.
server {
    listen 80;
    listen [::]:80;
    server_name gagroup24.ru www.gagroup24.ru;

    access_log off;
    error_log /dev/null crit;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
